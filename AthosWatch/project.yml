name: AthosWatch

options:
  bundleIdPrefix: com.athos
  createIntermediateGroups: true
  deploymentTarget:
    watchOS: "10.0"
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Xcode 27 的 explicit modules 在调 SwiftUI 的 @State 宏时会让
    # swift-plugin-server 返回 malformed response，关掉后正常。
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
    # 由 tools/set-team.sh 自动填写，也可手动替换成你的 10 位 Team ID
    DEVELOPMENT_TEAM: "UAXGUNTFU8"
    CODE_SIGN_STYLE: Automatic

targets:

  # ── 手机端：转写 + 展示 + 落地提醒事项 ──
  AthosPhone:
    type: application
    platform: iOS
    sources:
      - path: Phone
      - path: Shared
    # 手表 App 作为伴随 App 嵌进 iOS App 里。
    # 这一步是蓝牙直连的**前提**：WKWatchOnly 的独立手表 App
    # 没有配对对象，WCSession 永远激活不了。
    dependencies:
      - target: AthosWatch
    info:
      path: Support/Info-Phone.plist
      properties:
        CFBundleDisplayName: Athos
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSRemindersFullAccessUsageDescription: "Athos 只在你亲手确认之后，把那条承诺写进提醒事项。没有确认的一律不写。"
        NSMicrophoneUsageDescription: "Athos 需要麦克风来录下你答应的那些话。"
        NSSpeechRecognitionUsageDescription: "Athos 把录音转成文字，才能知道你答应了什么。识别在本机完成，音频和文字都不上传。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kakaqiang.athos.phone
        PRODUCT_NAME: Athos
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      gatherCoverageData: false

  # ── 手表端：录 + 判断。转写借手机的引擎，因为 watchOS 没有 Speech ──
  AthosWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources
      - path: Shared
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Athos
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        # 单 target 的 watchOS App，但**不再是** WKWatchOnly：
        # 它作为 iPhone App 的伴随表盘 App 存在，这样 WCSession 才有配对对象。
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.kakaqiang.athos.phone
        NSMicrophoneUsageDescription: "Athos 需要麦克风判断环境中是否有人说话。仅在音量持续超过噪声底时写入音频片段，静音时段不产生文件。"
        NSRemindersFullAccessUsageDescription: "Athos 把你说到的待办事项写进提醒事项，方便你在 iPhone 上勾选完成。"
        UIBackgroundModes:
          - audio
        UIRequiredDeviceCapabilities:
          - watch
    settings:
      base:
        # 伴随 App 的 bundle id 必须以宿主 App 为前缀，否则安装时被系统拒绝
        PRODUCT_BUNDLE_IDENTIFIER: com.kakaqiang.athos.phone.watchkitapp
        PRODUCT_NAME: Athos
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES

schemes:
  AthosPhone:
    build:
      targets:
        AthosPhone: all
    run:
      config: Debug
    archive:
      config: Release
